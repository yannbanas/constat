[package]
name = "constat-bench"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[dependencies]
constat-model = { path = "../crates/constat-model" }
constat-store = { path = "../crates/constat-store" }
constat-time = { path = "../crates/constat-time" }
constat-policy = { path = "../crates/constat-policy" }
constat-cli = { path = "../crates/constat-cli" }
constat-verify = { path = "../crates/constat-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Mémoire de pointe (PeakWorkingSetSize) sans dépendance lourde : bindings
# bruts, une seule famille de fonctions.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# Hors workspace, délibérément (même modèle que fuzz/) : le harnais de charge
# n'est pas un livrable du produit, il ne doit ni entrer dans l'arbre de
# dépendances vérifié par deny.toml, ni alourdir la compilation du workspace.
# Cette table vide fait de bench/ un workspace indépendant.
[workspace]

[profile.release]
debug = 1
