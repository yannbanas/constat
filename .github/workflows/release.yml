# Publication d'une version : binaires attachés à la release GitHub + image
# conteneur sur GHCR. Déclenché par un tag `v*`.
#
# Chaîne d'approvisionnement (§17) : compilation depuis le tag exact,
# empreintes SHA-256 publiées avec les archives, SBOM et provenance activés
# sur l'image.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaires:
    name: binaires (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilation
        run: cargo build --release --locked -p constat-cli -p constat-agent -p constat-server -p constat-verify
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          name="constat-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          for bin in constat constat-agent constat-server constat-verify; do
            cp "target/release/${bin}${ext}" "dist/${name}/"
          done
          cp LICENSE NOTICE README.md "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" > /dev/null
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar czf "${name}.tar.gz" "${name}"
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          rm -r "${name}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Paquets Linux : .deb et .rpm assemblés par packaging/build-packages.sh
  # (dpkg-deb + rpmbuild sur des squelettes versionnés — explicite,
  # auditable, sans magie). aarch64 est construit nativement sur le runner
  # ARM : aucun cross-toolchain.
  paquets-linux:
    name: paquets Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Outils de paquetage
        run: sudo apt-get update && sudo apt-get install -y rpm shellcheck
      - name: shellcheck des scripts de paquetage
        run: |
          shellcheck packaging/build-packages.sh \
            packaging/deb/constat-agent/postinst packaging/deb/constat-agent/prerm \
            packaging/deb/constat-agent/postrm \
            packaging/deb/constat-server/postinst packaging/deb/constat-server/prerm \
            packaging/deb/constat-server/postrm
      - name: Construction des paquets (.deb + .rpm, empreintes SHA-256)
        run: bash packaging/build-packages.sh --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-paquets-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # SBOM de la version (§17) : nomenclature SPDX générée par syft depuis les
  # sources au tag exact — c'est Cargo.lock (--locked) qui décrit, au commit
  # près, les dépendances effectivement compilées dans les binaires. Honnête :
  # les binaires étant «strippés», ils ne se décrivent pas eux-mêmes ; la
  # nomenclature couvre le graphe de dépendances verrouillé du build.
  sbom:
    name: SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Générer la nomenclature SPDX
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          "${{ steps.syft.outputs.cmd }}" scan dir:. \
            --source-name constat --source-version "${version#v}" \
            -o "spdx-json=dist/constat-${version}-sbom.spdx.json"
          cd dist
          sha256sum "constat-${version}-sbom.spdx.json" > "constat-${version}-sbom.spdx.json.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sbom
          path: dist/*
          if-no-files-found: error

  release:
    name: release GitHub
    needs: [binaires, paquets-linux, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # Uniquement nos archives : docker/build-push-action téléverse aussi
          # un artefact *.dockerbuild (journal de build) parfois corrompu, qui
          # faisait échouer le téléchargement sans ce filtre.
          pattern: dist-*
      - name: Attacher les binaires à la release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # La release et ses notes sont créées par `gh release create` ;
          # cette étape ne fait qu'y attacher les archives et leurs empreintes.
          draft: false

  image:
    name: image GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Provenance SLSA des artefacts (§17) : attestation signée par GitHub
  # (Sigstore) liant chaque archive, paquet et SBOM au commit, au workflow
  # et au runner qui les ont produits. Vérifiable par quiconque, sans accès
  # au dépôt privé de qui que ce soit :
  #   gh attestation verify constat-vX.Y.Z-<cible>.tar.gz -R yannbanas/constat
  attestation:
    name: provenance SLSA (attestations)
    needs: [binaires, paquets-linux, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: dist-*
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.spdx.json
