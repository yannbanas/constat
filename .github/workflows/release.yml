# Publication d'une version : binaires attachés à la release GitHub + image
# conteneur sur GHCR. Déclenché par un tag `v*`.
#
# Chaîne d'approvisionnement (§17) : compilation depuis le tag exact,
# empreintes SHA-256 publiées avec les archives, SBOM et provenance activés
# sur l'image.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaires:
    name: binaires (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilation
        run: cargo build --release --locked -p constat-cli -p constat-agent -p constat-server -p constat-verify
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          name="constat-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          for bin in constat constat-agent constat-server constat-verify; do
            cp "target/release/${bin}${ext}" "dist/${name}/"
          done
          cp LICENSE NOTICE README.md "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" > /dev/null
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar czf "${name}.tar.gz" "${name}"
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          rm -r "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release GitHub
    needs: binaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # Uniquement nos archives : docker/build-push-action téléverse aussi
          # un artefact *.dockerbuild (journal de build) parfois corrompu, qui
          # faisait échouer le téléchargement sans ce filtre.
          pattern: dist-*
      - name: Attacher les binaires à la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # La release et ses notes sont créées par `gh release create` ;
          # cette étape ne fait qu'y attacher les archives et leurs empreintes.
          draft: false

  image:
    name: image GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
