[package]
name = "constat-cli"
description = "Interface en ligne de commande de Constat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "constat"
path = "src/main.rs"

[dependencies]
constat-model = { workspace = true }
constat-time = { workspace = true }
constat-policy = { workspace = true }
constat-diff = { workspace = true }
constat-store = { workspace = true }
constat-report = { workspace = true }
constat-anchor = { workspace = true }
# `constat segmentation` re-découpe le blob multi-sections du collecteur
# network.configs avec le MÊME découpeur que la collecte
# (constat_collect::capture::split_sections) : un seul format, jamais deux.
constat-collect = { workspace = true }
# La jonction avec Calque (§14) : `constat segmentation` évalue les
# configurations réseau historiques du magasin avec le moteur de Calque —
# import constructeur (calque-vendors), topologie et préparation moteur
# (calque-engine), tests de flux (calque-policy), fidélité (calque-model).
# Épinglées par tag git, exception justifiée dans deny.toml.
calque-model = { workspace = true }
calque-engine = { workspace = true }
calque-policy = { workspace = true }
calque-vendors = { workspace = true }
# Empreinte BLAKE3 du fichier de flux, enregistrée dans les faits de
# `segmentation --record` (même fonction de hachage que tout le magasin).
blake3 = { workspace = true }
clap = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
thiserror = { workspace = true }
serde = { workspace = true }
# Table de correspondance par référentiel (§10.2.3) : même format YAML que
# les assertions du §5.2.
serde_yaml = { workspace = true }
# Client HTTPS de `constat anchor --send` : rustls synchrone sur
# std::net::TcpStream, même profil que l'agent et le serveur (fournisseur
# ring fixé explicitement, pas d'exécuteur asynchrone).
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# Racines de confiance Mozilla, embarquées : les prestataires d'horodatage
# publics présentent des certificats publics — aucun magasin système à lire,
# comportement identique sur toutes les plateformes. Version explicite :
# ce paquet n'est que des données (ancres X.509), aucune exécution réseau.
webpki-roots = "1.0"

[dev-dependencies]
# Tests uniquement : revérification complète d'un export (constat-verify est
# le vérificateur autonome du §10.3) et relecture des fichiers CBOR canoniques.
constat-verify = { workspace = true }
ciborium = { workspace = true }
# Serveur TLS local des tests HTTPS : certificat auto-signé fabriqué par
# rcgen, racine injectée côté client — aucun réseau externe dans les tests.
rcgen = { workspace = true }

[lints]
workspace = true
