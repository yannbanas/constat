[package]
name = "constat-server"
description = "Serveur collecteur : réception mTLS, aucun chemin de retour vers le parc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
constat-model = { workspace = true }
constat-store = { workspace = true }
clap = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
serde = { workspace = true }
thiserror = { workspace = true }
# Écouteur mTLS synchrone : rustls sur std::net::TcpListener, un thread par
# connexion — pas de runtime async, pas de bibliothèque HTTP.
# Fournisseur cryptographique `ring` explicitement (et non le défaut
# aws-lc-rs) : compilation portable sans cmake/NASM, surface plus réduite.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
# Lecture des fichiers PEM (certificat serveur, clé, autorité des agents).
# 1.10 au minimum : le module `pem` (PemObject) n'existe pas avant.
rustls-pki-types = { version = "1.10", features = ["std"] }

[dev-dependencies]
# Test bout-en-bout : le vrai client de poussée de l'agent contre ce serveur.
constat-agent = { path = "../constat-agent" }
# Génération d'une petite PKI de test (CA serveur, CA agents, certs feuilles).
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[lints]
workspace = true
