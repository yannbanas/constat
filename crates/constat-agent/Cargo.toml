[package]
name = "constat-agent"
description = "Agent de collecte : lecture seule, aucun port en écoute, poussée sortante mTLS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
constat-model = { workspace = true }
constat-collect = { workspace = true }
constat-store = { workspace = true }
clap = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
hex = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# Transport de la poussée sortante (§7.1) : rustls synchrone sur
# std::net::TcpStream — pas de runtime async, pas de bibliothèque HTTP.
# Fournisseur cryptographique `ring` explicitement (et non le défaut
# aws-lc-rs) : compilation portable sans cmake/NASM, surface plus réduite.
rustls = { workspace = true }
# Lecture des fichiers PEM (certificat client, clé, autorité du serveur).
# 1.10 au minimum : le module `pem` (PemObject) n'existe pas avant.
rustls-pki-types = { workspace = true }

[lints]
workspace = true
