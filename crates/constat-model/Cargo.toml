[package]
name = "constat-model"
description = "Cœur pur de Constat : faits, entités, snapshots, sérialisation canonique"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Expose le module `testing` (générateurs proptest réutilisables par les autres
# crates du workspace pour leurs propres tests par propriétés).
testing = ["dep:proptest"]

[dependencies]
serde = { workspace = true }
ciborium = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
proptest = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
