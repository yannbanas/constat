!
! Configuration fictive et anonyme - fixture de test constat.
! Adressage RFC1918 invente ; secrets FACTICES pour exercer l'expurgation.
!
version 15.4
service timestamps log datetime msec
service password-encryption
!
hostname rtr-agence-02
!
enable secret 5 $1$zzzz$condensatEntierementFictif000
!
username ops secret 5 $1$yyyy$autreCondensatFictif1234567
username invite password 0 MotDePasseFictif
!
interface GigabitEthernet0/0
 description LAN utilisateurs
 ip address 10.20.1.1 255.255.255.0
 ip access-group ACL-ENTREE-LAN in
 no shutdown
!
interface GigabitEthernet0/1
 description segment serveurs
 ip address 10.20.2.1 255.255.255.0
 standby 1 ip 10.20.2.254
 standby 1 authentication md5 key-string ClefHsrpFictive
!
interface GigabitEthernet0/2
 description liaison WAN operateur
 ip address 10.200.1.2 255.255.255.252
!
ip route 0.0.0.0 0.0.0.0 10.200.1.1
!
ip access-list extended ACL-ENTREE-LAN
 permit tcp 10.20.1.0 0.0.0.255 host 10.20.2.10 eq 445
 permit udp any host 10.20.2.53 eq domain
 deny ip any any log
!
key chain SECOURS
 key 1
  key-string ClefChaineFictive
!
crypto isakmp key ClefIsakmpFictive address 10.200.1.9
!
tacacs-server host 10.20.2.40 key 7 0822455D0A16FICTIF
radius-server host 10.20.2.41 auth-port 1812 key ClefRadiusFictive
!
snmp-server community lecture-fictive RO
logging host 10.20.2.20
ntp server 10.20.2.30
!
line vty 0 4
 transport input ssh
!
end
