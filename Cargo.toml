[workspace]
resolver = "2"
members = [
    "crates/constat-model",
    "crates/constat-time",
    "crates/constat-policy",
    "crates/constat-diff",
    "crates/constat-store",
    "crates/constat-anchor",
    "crates/constat-collect",
    "crates/constat-report",
    "crates/constat-verify",
    "crates/constat-agent",
    "crates/constat-server",
    "crates/constat-cli",
]

[workspace.package]
version = "0.3.0"
# Crates non publiés sur crates.io (distribution par binaires et image).
# Cohérent avec licenses.private.ignore et allow-wildcard-paths de deny.toml.
publish = false
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yannbanas/constat"
rust-version = "1.85"

[workspace.dependencies]
constat-model = { path = "crates/constat-model" }
constat-time = { path = "crates/constat-time" }
constat-policy = { path = "crates/constat-policy" }
constat-diff = { path = "crates/constat-diff" }
constat-store = { path = "crates/constat-store" }
constat-anchor = { path = "crates/constat-anchor" }
constat-collect = { path = "crates/constat-collect" }
constat-report = { path = "crates/constat-report" }
constat-verify = { path = "crates/constat-verify" }

# La jonction avec Calque (§14, S7) : l'évaluation d'accessibilité des
# configurations réseau historiques. Dépôt de la même organisation, épinglé
# par tag — l'exception correspondante est justifiée dans deny.toml (§17).
calque-model = { git = "https://github.com/yannbanas/calque", tag = "v0.3.0" }
calque-engine = { git = "https://github.com/yannbanas/calque", tag = "v0.3.0" }
calque-policy = { git = "https://github.com/yannbanas/calque", tag = "v0.3.0" }
calque-vendors = { git = "https://github.com/yannbanas/calque", tag = "v0.3.0" }

serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.9"
zstd = "0.13"
redb = "2"
# rustls synchrone, fournisseur ring fixé (pas d'aws-lc-rs : compilation
# Windows sans cmake/NASM) — configuration partagée par agent, serveur et CLI.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
rustls-pki-types = { version = "1.10", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
clap = { version = "4", features = ["derive"] }
miette = "7"
thiserror = "2"
serde_yaml = "0.9"
proptest = "1"
insta = "1"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
