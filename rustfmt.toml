# rustfmt — configuration de Constat
#
# Volontairement : la configuration par défaut de rustfmt stable, rendue
# explicite. Aucune option instable (nightly-only), pour que `cargo fmt`
# produise le même résultat chez tous les contributeurs et en CI.

edition = "2021"

# Défauts explicités (valeurs stables de rustfmt) :
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Auto"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
match_arm_leading_pipes = "Never"
fn_params_layout = "Tall"
merge_derives = true
use_try_shorthand = false
use_field_init_shorthand = false
force_explicit_abi = true
