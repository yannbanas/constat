# Faits attendus pour corpus/sshd/blocs-match/capture.txt
#
# Format : voir corpus/README.md. La liste est EXHAUSTIVE (comparaison dans
# les deux sens par tests/corpus.rs).
#
# Deux pièges classiques d'un sshd_config réel :
#
# 1. Directives DUPLIQUÉES : la sémantique OpenSSH est « première occurrence
#    gagnante ». Le second `PermitRootLogin yes` est sans effet — remonter
#    « yes » serait un verdict faux.
# 2. Blocs `Match` : leurs directives sont CONDITIONNELLES. Elles ne sont
#    jamais remontées comme faits globaux — les remonter serait mentir sur
#    l'état effectif hors condition. Conséquence : `X11Forwarding` et
#    `AllowTcpForwarding`, présents UNIQUEMENT dans un bloc Match, sont
#    `Absent` au niveau global.

collector: sshd
case: blocs-match

facts:
  - entity: "service:sshd"
    attribute: "sshd.Port"
    value: { list: [{ int: 22 }, { int: 2222 }] }

  # première occurrence gagnante : "no", pas le "yes" dupliqué plus bas,
  # ni le "prohibit-password" du bloc Match
  - entity: "service:sshd"
    attribute: "sshd.PermitRootLogin"
    value: { text: "no" }

  - entity: "service:sshd"
    attribute: "sshd.PasswordAuthentication"
    value: { text: "no" }

  - entity: "service:sshd"
    attribute: "sshd.PubkeyAuthentication"
    value: { text: "yes" }

  # première occurrence gagnante : 3, pas le 6 du bloc Match
  - entity: "service:sshd"
    attribute: "sshd.MaxAuthTries"
    value: { int: 3 }

  # présents UNIQUEMENT dans un bloc Match : conditionnels, donc Absent au
  # niveau global — même si la valeur conditionnelle est « no »
  - entity: "service:sshd"
    attribute: "sshd.X11Forwarding"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.AllowTcpForwarding"
    value: { absent: true }

  # jamais mentionnées dans le fichier : le défaut du système s'applique
  - entity: "service:sshd"
    attribute: "sshd.PermitEmptyPasswords"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.ChallengeResponseAuthentication"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.KbdInteractiveAuthentication"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.LoginGraceTime"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.UsePAM"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.Protocol"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.MaxSessions"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.StrictModes"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.LogLevel"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.ClientAliveInterval"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.ClientAliveCountMax"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.AllowGroups"
    value: { absent: true }
