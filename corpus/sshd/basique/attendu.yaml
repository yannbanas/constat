# Faits attendus pour corpus/sshd/basique/capture.txt
#
# Format : voir corpus/README.md. La liste est EXHAUSTIVE : le harnais
# (crates/constat-collect/tests/corpus.rs) compare dans les deux sens —
# un fait produit non listé ici est un échec, comme un fait listé manquant.
#
# Représentation : les valeurs « booléennes » d'OpenSSH restent du TEXTE
# ("yes"/"no") — `PermitRootLogin` admet aussi `prohibit-password` ou
# `forced-commands-only`, normaliser en booléen perdrait cette nuance.
# `value: { absent: true }` signifie Value::Absent — la directive ne figure
# pas dans le fichier (le défaut du système s'applique) ; ce n'est PAS "no".
# Une directive présente uniquement en commentaire (#X11Forwarding no) est
# absente : un commentaire n'est pas une directive.

collector: sshd
case: basique

facts:
  - entity: "service:sshd"
    attribute: "sshd.Port"
    value: { int: 22 }

  - entity: "service:sshd"
    attribute: "sshd.PermitRootLogin"
    value: { text: "no" }

  - entity: "service:sshd"
    attribute: "sshd.PasswordAuthentication"
    value: { text: "no" }

  - entity: "service:sshd"
    attribute: "sshd.PermitEmptyPasswords"
    value: { text: "no" }

  - entity: "service:sshd"
    attribute: "sshd.PubkeyAuthentication"
    value: { text: "yes" }

  - entity: "service:sshd"
    attribute: "sshd.KbdInteractiveAuthentication"
    value: { text: "no" }

  # l'ancien nom de KbdInteractiveAuthentication : jamais écrit ici → Absent
  - entity: "service:sshd"
    attribute: "sshd.ChallengeResponseAuthentication"
    value: { absent: true }

  - entity: "service:sshd"
    attribute: "sshd.MaxAuthTries"
    value: { int: 3 }

  - entity: "service:sshd"
    attribute: "sshd.MaxSessions"
    value: { int: 4 }

  - entity: "service:sshd"
    attribute: "sshd.LoginGraceTime"
    value: { int: 30 }

  - entity: "service:sshd"
    attribute: "sshd.StrictModes"
    value: { text: "yes" }

  - entity: "service:sshd"
    attribute: "sshd.UsePAM"
    value: { text: "yes" }

  - entity: "service:sshd"
    attribute: "sshd.AllowTcpForwarding"
    value: { text: "no" }

  - entity: "service:sshd"
    attribute: "sshd.LogLevel"
    value: { text: "VERBOSE" }

  - entity: "service:sshd"
    attribute: "sshd.ClientAliveInterval"
    value: { int: 300 }

  - entity: "service:sshd"
    attribute: "sshd.ClientAliveCountMax"
    value: { int: 2 }

  - entity: "service:sshd"
    attribute: "sshd.AllowGroups"
    value: { list: [{ text: "ssh-users" }] }

  # directive absente du fichier (sshd moderne : protocole 2 implicite)
  - entity: "service:sshd"
    attribute: "sshd.Protocol"
    value: { absent: true }

  # Le cas qui compte : X11Forwarding n'apparaît qu'en commentaire dans le
  # fichier. L'attribut est donc ABSENT — le défaut du système s'applique,
  # qui varie selon les versions. L'extracteur ne doit ni produire "no",
  # ni omettre le fait : l'absence est un fait, et souvent LE fait important.
  - entity: "service:sshd"
    attribute: "sshd.X11Forwarding"
    value: { absent: true }
